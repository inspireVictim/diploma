<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEO-SYNC | Future Service</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg: #050507;
            --glass: rgba(255, 255, 255, 0.03);
            --neon: #00f2ff;
            --accent: #7000ff;
            --text: #e0e0e0;
        }

        * { box-sizing: border-box; scroll-behavior: smooth; }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', 'Segoe UI', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        /* Анимация фона */
        .blob {
            position: fixed;
            width: 500px; height: 500px;
            background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
            filter: blur(80px);
            opacity: 0.15;
            z-index: -1;
            animation: move 20s infinite alternate;
        }

        @keyframes move {
            from { transform: translate(-10%, -10%); }
            to { transform: translate(50%, 50%); }
        }

        header {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .hero-title {
            font-size: 4rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 10px;
            margin: 0;
            background: linear-gradient(to right, #fff, var(--neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: fadeIn 1.5s ease-out;
        }

        .services {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 100px 10%;
        }

        .card {
            background: var(--glass);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            transition: 0.4s;
            opacity: 0;
            transform: translateY(30px);
        }

        .card.visible { opacity: 1; transform: translateY(0); }
        .card:hover { border-color: var(--neon); transform: translateY(-10px); }

        .btn-main {
            margin-top: 30px;
            padding: 15px 40px;
            border: 1px solid var(--neon);
            background: transparent;
            color: var(--neon);
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            border-radius: 50px;
            transition: 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-main:hover { background: var(--neon); color: #000; box-shadow: 0 0 30px var(--neon); }

        /* Модальное окно */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #111;
            padding: 40px;
            border-radius: 20px;
            width: 90%;
            max-width: 450px;
            border: 1px solid var(--accent);
        }

        input, select {
            width: 100%; padding: 12px; margin: 10px 0;
            background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 8px;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="blob"></div>

<header>
    <h1 class="hero-title">NEO-SYNC</h1>
    <p style="letter-spacing: 3px; color: var(--neon)">HIGH-TECH MAINTENANCE STATION</p>
    <a href="#" class="btn-main" onclick="openModal()">Забронировать слот</a>
</header>

<section class="services" id="trigger">
    <div class="card">
        <i class="fas fa-microchip fa-2x" style="color: var(--neon)"></i>
        <h3>Диагностика</h3>
        <p>Полное сканирование систем на квантовом уровне.</p>
    </div>
    <div class="card">
        <i class="fas fa-bolt fa-2x" style="color: var(--accent)"></i>
        <h3>Тюнинг</h3>
        <p>Оптимизация производительности и ПО вашего ТС.</p>
    </div>
    <div class="card">
        <i class="fas fa-shield-alt fa-2x" style="color: #fff"></i>
        <h3>Защита</h3>
        <p>Установка продвинутых систем безопасности.</p>
    </div>
</section>

<div class="modal" id="orderModal">
    <div class="modal-content">
        <h2 style="color: var(--neon)">Оставить заявку</h2>
        <form id="serviceForm">
            <input type="text" id="client_name" placeholder="Ваше имя" required>
            <input type="text" id="vehicle" placeholder="Модель ТС" required>
            <input type="datetime-local" id="service_date" required>
            <select id="service_type">
                <option value="Standard">Стандарт</option>
                <option value="Diagnostics">Диагностика</option>
                <option value="Repair">Ремонт</option>
            </select>
            <button type="submit" class="btn-main" style="width: 100%">Отправить</button>
            <button type="button" onclick="closeModal()" style="background:none; border:none; color:#666; cursor:pointer; margin-top:10px">Закрыть</button>
        </form>
    </div>
</div>

<script>
    function openModal() { document.getElementById('orderModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('orderModal').style.display = 'none'; }

    // Простая анимация появления при скролле
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if(entry.isIntersecting) entry.target.classList.add('visible');
        });
    }, { threshold: 0.1 });

    document.querySelectorAll('.card').forEach(card => observer.observe(card));

    document.getElementById('serviceForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const data = {
            client_name: document.getElementById('client_name').value,
            vehicle: document.getElementById('vehicle').value,
            service_date: document.getElementById('service_date').value,
            service_type: document.getElementById('service_type').value
        };
        const res = await fetch('http://127.0.0.1:8000/booking', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        });
        if(res.ok) { alert('Заявка принята!'); closeModal(); }
    });
</script>
</body>
</html>
