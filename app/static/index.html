<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEO-SYNC | Сервис техники</title>
    <style>
        :root {
            --bg: #050507;
            --panel: rgba(255, 255, 255, 0.04);
            --line: rgba(255, 255, 255, 0.12);
            --neon: #00f2ff;
            --accent: #ff2e88;
            --text: #f4f7fb;
            --muted: #9aa6b2;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, "Segoe UI", Arial, sans-serif;
        }

        nav {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            gap: 16px;
            padding: 16px 32px;
            background: rgba(5, 5, 7, 0.86);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--line);
        }

        nav a { color: var(--text); text-decoration: none; }
        .brand { color: var(--neon); font-weight: 800; letter-spacing: 3px; }
        .links { display: flex; gap: 18px; flex-wrap: wrap; }

        header {
            min-height: 72vh;
            display: grid;
            place-items: center;
            padding: 32px;
            text-align: center;
            border-bottom: 1px solid var(--line);
        }

        h1 {
            margin: 0;
            font-size: clamp(48px, 9vw, 112px);
            letter-spacing: 8px;
            color: var(--neon);
        }

        section {
            max-width: 1080px;
            margin: 0 auto;
            padding: 64px 24px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
        }

        .card, form {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 22px;
        }

        input, select, textarea, button {
            width: 100%;
            padding: 12px 14px;
            margin-top: 10px;
            border-radius: 6px;
            border: 1px solid var(--line);
            background: #111218;
            color: var(--text);
            font: inherit;
        }

        textarea { min-height: 110px; resize: vertical; }

        button {
            cursor: pointer;
            border-color: var(--neon);
            color: #001014;
            background: var(--neon);
            font-weight: 700;
        }

        .muted { color: var(--muted); }
    </style>
</head>
<body>
    <nav>
        <a class="brand" href="/">NEO-SYNC</a>
        <div class="links">
            <a href="#services">Услуги</a>
            <a href="#booking">Запись</a>
            <a href="#contacts">Контакты</a>
            <a href="/admin.html">Админка</a>
        </div>
    </nav>

    <header>
        <div>
            <h1>NEO-SYNC</h1>
            <p class="muted">Киберпанковый сервисный центр компьютерной техники</p>
        </div>
    </header>

    <section id="services">
        <h2>Каталог услуг</h2>
        <div class="grid" id="servicesGrid"></div>
    </section>

    <section id="booking">
        <h2>Записаться на обслуживание техники</h2>
        <form id="bookingForm">
            <input id="client_name" type="text" placeholder="Ваше имя" required>
            <input id="device" type="text" placeholder="Устройство: ноутбук, ПК, принтер" required>
            <select id="service_id" required></select>
            <input id="service_date" type="datetime-local" required>
            <button type="submit">Отправить заявку</button>
        </form>
    </section>

    <section id="contacts">
        <h2>Контакты</h2>
        <form id="feedbackForm">
            <input id="name" type="text" placeholder="Ваше имя" required>
            <input id="email_or_phone" type="text" placeholder="Email или телефон" required>
            <textarea id="message" placeholder="Сообщение" required></textarea>
            <button type="submit">Отправить сообщение</button>
        </form>
    </section>

    <script>
        const serviceSelect = document.getElementById('service_id');

        async function loadServices() {
            const response = await fetch('/api/services');
            const services = await response.json();
            document.getElementById('servicesGrid').innerHTML = services.map(service => `
                <article class="card">
                    <h3>${service.title}</h3>
                    <p class="muted">${service.description}</p>
                    <strong>${service.price} KGZ</strong>
                </article>
            `).join('');
            serviceSelect.innerHTML = services.map(service => `
                <option value="${service.id}">${service.title}</option>
            `).join('');
        }

        document.getElementById('bookingForm').addEventListener('submit', async event => {
            event.preventDefault();
            const payload = {
                client_name: document.getElementById('client_name').value,
                device: document.getElementById('device').value,
                service_id: Number(serviceSelect.value),
                service_date: document.getElementById('service_date').value
            };
            const response = await fetch('/api/bookings', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            alert(response.ok ? 'Заявка принята' : 'Проверьте данные заявки');
        });

        document.getElementById('feedbackForm').addEventListener('submit', async event => {
            event.preventDefault();
            const payload = {
                name: document.getElementById('name').value,
                email_or_phone: document.getElementById('email_or_phone').value,
                message: document.getElementById('message').value
            };
            const response = await fetch('/api/feedbacks', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            alert(response.ok ? 'Сообщение отправлено' : 'Проверьте контактные данные');
        });

        loadServices();
    </script>
</body>
</html>
