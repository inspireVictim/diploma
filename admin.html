<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Панель управления | Admin</title>
    <style>
        body { background: #0a0a0a; color: #fff; font-family: sans-serif; padding: 40px; }
        table { width: 100%; border-collapse: collapse; background: #111; border-radius: 10px; overflow: hidden; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #222; }
        th { background: #1a1a1a; color: #00f2ff; }
        .btn-del { color: #ff4444; cursor: pointer; background: none; border: 1px solid #ff4444; padding: 5px 10px; border-radius: 5px; }
        .btn-del:hover { background: #ff4444; color: #fff; }
    </style>
</head>
<body>
    <h1>Список заявок</h1>
    <table>
        <thead>
            <tr>
                <th>ID</th><th>Клиент</th><th>Авто</th><th>Дата</th><th>Тип</th><th>Действие</th>
            </tr>
        </thead>
        <tbody id="adminTable"></tbody>
    </table>

    <script>
        async function loadData() {
            const res = await fetch('http://127.0.0.1:8000/admin/requests');
            const data = await res.json();
            const table = document.getElementById('adminTable');
            table.innerHTML = data.map(req => `
                <tr>
                    <td>${req[0]}</td>
                    <td>${req[1]}</td>
                    <td>${req[2]}</td>
                    <td>${req[3]}</td>
                    <td>${req[4]}</td>
                    <td><button class="btn-del" onclick="deleteReq(${req[0]})">Удалить</button></td>
                </tr>
            `).join('');
        }

        async function deleteReq(id) {
            if(confirm('Удалить заявку?')) {
                await fetch(`http://127.0.0.1:8000/admin/requests/${id}`, { method: 'DELETE' });
                loadData();
            }
        }
        loadData();
    </script>
</body>
</html>
